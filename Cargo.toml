[package]
name = "ign"
version = "0.1.0"
edition = "2021"
authors = ["Skyxim"]
description = "A fast, flexible, and feature-rich GitHub .gitignore CLI manager written in Rust, based on https://github.com/github/gitignore."
license = "MIT"
repository = "https://github.com/Skyxim/ign"
homepage = "https://github.com/Skyxim/ign"
readme = "README.md"
keywords = ["gitignore", "git", "cli", "template", "generator"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ign"
path = "src/lib.rs"

[[bin]]
name = "ign"
path = "src/bin/ign.rs"

[[bin]]
name = "gitignore"
path = "src/bin/gitignore.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
anyhow = "1.0"
thiserror = "2.0"
colored = "2.1"
walkdir = "2.5"
fuzzy-matcher = "0.3"
inquire = "0.7"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3"
