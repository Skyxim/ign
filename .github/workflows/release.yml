name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-crate:
    name: Publish Crate to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Load CI secrets
        uses: protonpass/load-secret-action@dcb5cd91e8dd8db6c1fc0603738a26123c7fb75b
        with:
          version: '2.2.5'
          export-env: 'true'
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PASS_CLI_PAT }}
          CARGO_REGISTRY_TOKEN: pass://Env/PersonCargo/CrateAPIKey
      - name: Sync Cargo.toml version with Git Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing Cargo.toml version to: ${TAG_VERSION}"
          sed -i.bak -E '0,/^version = ".*"/s/^version = ".*"/version = "'"$TAG_VERSION"'"/' Cargo.toml
          rm -f Cargo.toml.bak
          cargo check

      - name: Publish to Crates.io
        run: cargo publish --locked

  build-release-binaries:
    name: Build & Upload Assets (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ign-x86_64-unknown-linux-gnu.tar.gz
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ign-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ign-x86_64-apple-darwin.tar.gz
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ign-aarch64-apple-darwin.tar.gz
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ign-x86_64-pc-windows-msvc.zip
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Sync Cargo.toml version with Git Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing Cargo.toml version to: ${TAG_VERSION}"
          sed -i.bak -E '0,/^version = ".*"/s/^version = ".*"/version = "'"$TAG_VERSION"'"/' Cargo.toml
          rm -f Cargo.toml.bak
          cargo check

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/ign stage/
          cp target/${{ matrix.target }}/release/gitignore stage/
          cp README.md LICENSE stage/
          cd stage
          tar -czf ../${{ matrix.artifact_name }} *

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/ign.exe stage/
          cp target/${{ matrix.target }}/release/gitignore.exe stage/
          cp README.md LICENSE stage/
          cd stage
          7z a ../${{ matrix.artifact_name }} *

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
